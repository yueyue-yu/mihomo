rule-providers:
  private:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.yaml
    path: ./ruleset/private.yaml
    behavior: domain
    interval: 86400
    format: yaml
    type: http
  cn_domain:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.yaml
    path: ./ruleset/cn_domain.yaml
    behavior: domain
    interval: 86400
    format: yaml
    type: http
  cn_ip:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.yaml
    path: ./ruleset/cn_ip.yaml
    behavior: ipcidr
    interval: 86400
    format: yaml
    type: http
  youtube:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.yaml
    path: ./ruleset/youtube.yaml
    behavior: domain
    interval: 86400
    format: yaml
    type: http
  gamedownload:
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/25aba9901fa3f4dbdce0f0a338457bc4a9adaf5d/rule/Clash/Game/GameDownload/GameDownload.yaml
    path: ./ruleset/gamedownload.yaml
    behavior: classical
    interval: 86400
    format: yaml
    type: http
  google:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.yaml
    path: ./ruleset/google.yaml
    behavior: domain
    interval: 86400
    format: yaml
    type: http
  category-ai-!cn:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.yaml
    path: ./ruleset/category-ai-!cn.yaml
    behavior: domain
    interval: 86400
    format: yaml
    type: http
  telegram:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.yaml
    path: ./ruleset/telegram.yaml
    behavior: domain
    interval: 86400
    format: yaml
    type: http
  telegram_ip:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.yaml
    path: ./ruleset/telegram_ip.yaml
    behavior: ipcidr
    interval: 86400
    format: yaml
    type: http

dns:
  enable: true
  ipv6: true #如网络环境不支持IPv6请设为false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: #使用geosite域名集合以精简配置，也可使用规则集（ruleset）
    - geosite:private
    - geosite:category-ntp
  use-hosts: false #如有特殊需求请设为true
  use-system-hosts: false #如有特殊需求请设为true
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  respect-rules: true

append-proxies:
  - name: Oracle
    type: socks5
    server: 161.153.73.161
    port: 12312
    username: ejp6

proxy-groups:
  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    name: PROXY
    type: select
    include-all: true
    exclude-filter: ^Oracle$
    proxies:
      - DIRECT
  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/YouTube.png
    name: YouTube
    type: select
    include-all: true
    exclude-filter: ^Oracle$
    proxies:
      - PROXY
      - DIRECT
  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Google.png
    name: Google & AI
    type: select
    proxies:
      - Oracle
  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Telegram.png
    name: Telegram
    type: select
    include-all: true
    exclude-filter: ^Oracle$
    proxies:
      - PROXY
      - DIRECT

rules:
  - "RULE-SET,private,DIRECT"
  - "RULE-SET,gamedownload,DIRECT"
  - "DOMAIN-SUFFIX,steamserver.net,DIRECT"
  - "RULE-SET,youtube,YouTube"
  - "RULE-SET,category-ai-!cn,Google & AI"
  - "RULE-SET,google,Google & AI"
  - "RULE-SET,telegram,Telegram"
  - "RULE-SET,telegram_ip,Telegram"
  - "RULE-SET,cn_domain,DIRECT"
  - "RULE-SET,cn_ip,DIRECT"
  - "MATCH,PROXY"
